<div class="max-w-6xl mx-auto px-5 py-12">
  <div class="text-center mb-10">
    <h1 class="text-4xl font-semibold text-gray-800">Contact us</h1>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-10 items-center">
    <!-- LEFT FORM -->
    <form 
      class="md:col-span-2 bg-white/20 backdrop-blur-xs p-6 rounded-2xl shadow-sm border border-white/30"
      hx-post="/submit-contact"
      hx-target="#form-response"
      hx-on::after-request="if(event.detail.successful) this.reset()"
    >
      <p class="mb-8 text-gray-600">
        Contact us about anything related to our company or services.
      </p>

      <div class="grid grid-cols-1 sm:grid-cols-2 mb-5 gap-5">
        <div class="flex flex-col">
          <label class="font-semibold mb-2 text-sm">Name *</label>
          <input class="w-full px-4 py-2.5 rounded-lg border-2 border-gray-300 focus:border-blue-500 outline-none transition-all text-sm" 
          type="text" name="name" pattern="[A-Za-z\s]*" placeholder="Enter your full name" required/>
        </div>

        <div class="flex flex-col">
          <label class="font-semibold mb-2 text-sm">Phone Number *</label>
          <div class="flex border-2 border-gray-300 rounded-lg overflow-hidden focus-within:border-blue-500 transition-all">
            <span class="bg-gray-100 px-3 py-2 text-gray-500 text-sm border-r border-gray-200">+91</span>
            <input class="w-full px-3 py-2 outline-none text-sm" 
              type="text" 
              name="phone" 
              pattern="\d{10}" 
              maxlength="10"
              placeholder="Enter 10 digit number"
              required 
            />
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 mb-5 gap-5">
        <div class="flex flex-col">
          <label class="font-semibold mb-2 text-sm">Email *</label>
          <input class="w-full px-4 py-2.5 rounded-lg border-2 border-gray-300 focus:border-blue-500 outline-none transition-all text-sm" 
          type="email" name="email" placeholder="abc123@gmail.com" required />
        </div>

        <div class="flex flex-col">
          <label class="font-semibold mb-2 text-sm">Company</label>
          <input class="w-full px-4 py-2.5 rounded-lg border-2 border-gray-300 focus:border-blue-500 outline-none transition-all text-sm" 
          type="text" name="company" />
        </div>
      </div>

      <div class="mb-5 flex flex-col">
        <label class="font-semibold mb-2 text-sm">Subject *</label>
        <input class="w-full px-4 py-2.5 rounded-lg border-2 border-gray-300 focus:border-blue-500 outline-none transition-all text-sm" 
        type="text" name="subject" required />
      </div>

      <div class="mb-6 flex flex-col">
        <label class="font-semibold mb-2 text-sm">Question *</label>
        <textarea class="w-full px-3 py-2.5 rounded-lg border-2 border-gray-300 focus:border-blue-500 outline-none transition-all text-sm" 
        name="question" rows="5" required></textarea>
      </div>

      <div class="hidden">
        <input type="text" name="honeypot" tabindex="-1" autocomplete="off">
      </div>

      <button class="bg-black text-white px-8 py-3 rounded-full text-sm hover:bg-gray-800 transition-all font-medium shadow-md active:scale-95">
        Submit
      </button>

      <!-- Response message will be displayed here after form submission -->
      <div id="form-response" class="mt-4"></div>
    </form>

    <!-- RIGHT INFO -->
  <div class="flex flex-col gap-6 text-gray-700 mt-5 md:mt-0 pl-10">   
    <div class="flex items-center gap-4 group">
      <div class="w-10 h-10 flex items-center justify-center bg-blue-50 rounded-full group-hover:bg-blue-100 transition-colors">
        <img src="static/icon/phone.svg" class="w-5 h-5" /> 
      </div>
        <p class="font-medium">+91 9471548888</p>
      </div>

      <div class="flex items-center gap-4 group">
        <div class="w-10 h-10 flex items-center justify-center bg-blue-50 rounded-full group-hover:bg-blue-100 transition-colors">
          <img src="static/icon/mail.svg" class="w-5 h-5" />
        </div>
        <p class="font-medium">admin@flowem.com</p>
      </div>

      <div class="flex items-center gap-4 group">
        <div class="w-10 h-10 flex items-center justify-center bg-blue-50 rounded-full group-hover:bg-blue-100 transition-colors">
          <img src="static/icon/location.svg" class="w-5 h-5" />
        </div>
        <p class="font-medium">Keshiary, Medinipur, West Bengal</p>
      </div>
    </div>
    
   </div>
  </div>
</div>
